name: Deploy to Tencent CloudBase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Deploy static files to CloudBase
        env:
          TCB_ENV_ID: xinjiang-d7gocy20t90474602
          TCB_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          mkdir publish
          rsync -a --exclude='.git' --exclude='.github' ./ publish/
          tcb hosting deploy publish -e "$TCB_ENV_ID"
